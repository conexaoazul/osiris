name: Publish OSIRIS image (manual, SHA-only)

# Opening or merging a PR must never publish or replace a runtime image.
# Operators release an immutable image explicitly from the master branch.
on:
  pull_request:
    paths:
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: osiris-image-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no push-triggered publisher exists
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/docker-publish.yml').read_text()
          triggers = workflow.split('\non:\n', 1)[1].split('\nconcurrency:', 1)[0]
          metadata = workflow.split('\n      - id: meta\n', 1)[1].split('\n      - id: build\n', 1)[0]
          assert '\n  push:' not in triggers, 'Push-triggered publication is forbidden'
          assert '\n  workflow_dispatch:' in triggers, 'Manual release trigger is required'
          assert 'type=sha,format=long,prefix=sha-' in metadata, 'Immutable SHA tag required'
          assert 'type=raw,value=latest' not in metadata, 'Mutable latest tag is forbidden'
          assert 'latest=false' in metadata, 'Implicit latest tag must be disabled'
          print('Release policy valid: no push trigger or mutable latest tag')
          PY

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run complete test suite
        run: npm test -- --reporter=dot

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js production app
        run: npm run build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable release reference
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Image: ${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the digest when deploying the Swarm stack." >> "$GITHUB_STEP_SUMMARY"
