# BlueOps OSIRIS - review-only Swarm template.
# SECURITY: internal-only. No published ports, proxy route, credentials or scanner.
# DO NOT DEPLOY before approved capacity, quorum, image and SSO gates.
services:
  osiris:
    image: "${OSIRIS_IMAGE:?Set OSIRIS_IMAGE to a reviewed immutable sha256 digest}"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    networks:
      - osiris_private
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        # Requires an explicitly approved node label; deliberately unschedulable beforehand.
        constraints:
          - node.labels.osiris_homolog == true
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1536M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

networks:
  osiris_private:
    driver: overlay
